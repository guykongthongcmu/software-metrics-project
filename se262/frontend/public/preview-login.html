<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Admin Panel — Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Inline the CSS variables that would normally come from app.css -->
    <style>
        :root {
            --golden-straw: #C8A77D;
            --text-primary: #1a1a2e;
            --text-muted: #7a7a8e;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-glass-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
            --status-danger: #F44336;
            --status-danger-bg: rgba(244, 67, 54, 0.08);
            --status-success: #4CAF50;
            --status-success-bg: rgba(76, 175, 80, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
        }

        /* Liquid Glass Background Orbs */
        .liquid-bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 12s ease-in-out infinite;
        }

        .liquid-orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(200, 167, 125, 0.5), transparent 70%);
            top: -10%;
            left: -5%;
            animation-delay: 0s;
        }

        .liquid-orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(100, 140, 200, 0.4), transparent 70%);
            top: 60%;
            right: -5%;
            animation-delay: -4s;
        }

        .liquid-orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(180, 120, 200, 0.35), transparent 70%);
            bottom: -5%;
            left: 30%;
            animation-delay: -8s;
        }

        .liquid-orb-4 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(120, 200, 180, 0.3), transparent 70%);
            top: 20%;
            right: 20%;
            animation-delay: -2s;
        }

        .liquid-orb-5 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(200, 167, 125, 0.3), transparent 70%);
            bottom: 20%;
            left: -10%;
            animation-delay: -6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -20px) scale(1.05);
            }

            50% {
                transform: translate(-20px, 30px) scale(0.95);
            }

            75% {
                transform: translate(20px, 20px) scale(1.02);
            }
        }

        /* Glass form elements */
        .glass-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .glass-input {
            display: block;
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .glass-input:focus {
            border-color: var(--golden-straw);
            box-shadow: 0 0 0 3px rgba(200, 167, 125, 0.15);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Golden button */
        .btn-golden {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--golden-straw), #b8956d);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-golden:hover {
            background: linear-gradient(135deg, #d4b78e, var(--golden-straw));
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(200, 167, 125, 0.4);
        }

        /* Override text-primary for dark theme */
        .login-card h2 {
            color: #ffffff !important;
        }

        .login-card .login-subtitle {
            color: rgba(255, 255, 255, 0.6) !important;
        }
    </style>

    <link href="css/login.css" rel="stylesheet">
</head>

<body>
    <!-- Decorative background orbs for glassmorphism effect -->
    <div class="liquid-bg-layer" aria-hidden="true">
        <div class="liquid-orb liquid-orb-1"></div>
        <div class="liquid-orb liquid-orb-2"></div>
        <div class="liquid-orb liquid-orb-3"></div>
        <div class="liquid-orb liquid-orb-4"></div>
        <div class="liquid-orb liquid-orb-5"></div>
    </div>

    <!-- Login Page Content (would normally be in views/pages/login.ejs) -->
    <div class="login-page">
        <div class="login-card fade-in">
            <div class="login-logo">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="login-subtitle">Sign in to Admin Panel</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="glass-label" for="email">Email Address</label>
                    <input type="email" id="email" class="glass-input" placeholder="admin@example.com" required>
                    <div class="input-error" id="emailError">Please enter a valid email address</div>
                </div>

                <div class="form-group">
                    <label class="glass-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="glass-input" placeholder="Enter your password"
                            required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="input-error" id="passwordError">Password is required</div>
                </div>

                <button type="submit" class="btn-golden btn-login">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                toggleBtn.querySelector('i').classList.toggle('bi-eye');
                toggleBtn.querySelector('i').classList.toggle('bi-eye-slash');
            });
        }
    </script>
</body>

</html>
