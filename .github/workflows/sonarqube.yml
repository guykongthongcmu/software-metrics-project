name: SonarQube Cloud

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core_co
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: postgres
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Sonar can blame and detect new code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: se327/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: se327/backend
        run: pip install -r requirements.txt coverage

      - name: Run tests with coverage
        working-directory: se327/backend
        run: |
          coverage run --source=. --omit=".venv/*,*/migrations/*,manage.py" manage.py test
          coverage xml -o coverage.xml

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
