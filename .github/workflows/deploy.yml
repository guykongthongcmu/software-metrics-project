name: Deploy

on:
  push:
    branches: [release, development]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          REPO="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          NAMESPACE="$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
          REF="$(echo "${GITHUB_REF_NAME}" | tr '/_' '-' | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          BACKEND_IMAGE="docker.io/${NAMESPACE}/${REPO}-backend:${REF}-${SHA_SHORT}"
          BACKEND_IMAGE_LATEST="docker.io/${NAMESPACE}/${REPO}-backend:${REF}-latest"
          FRONTEND_IMAGE="docker.io/${NAMESPACE}/${REPO}-frontend:${REF}-${SHA_SHORT}"
          FRONTEND_IMAGE_LATEST="docker.io/${NAMESPACE}/${REPO}-frontend:${REF}-latest"

          echo "backend_image=${BACKEND_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "backend_image_latest=${BACKEND_IMAGE_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image_latest=${FRONTEND_IMAGE_LATEST}" >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.meta.outputs.backend_image_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.meta.outputs.frontend_image_latest }}

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            mkdir -p "$APP_DIR/backend"

      - name: Upload deploy artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            cd "$APP_DIR"

            REPO_RAW='${{ github.repository }}'
            REF_RAW='${{ github.ref_name }}'
            SHA_RAW='${{ github.sha }}'

            REPO="$(echo "${REPO_RAW#*/}" | tr '[:upper:]' '[:lower:]')"
            NAMESPACE="$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
            REF="$(echo "${REF_RAW}" | tr '/_' '-' | tr '[:upper:]' '[:lower:]')"
            SHA_SHORT="$(echo "${SHA_RAW}" | cut -c1-7)"

            BACKEND_IMAGE="docker.io/${NAMESPACE}/${REPO}-backend:${REF}-${SHA_SHORT}"
            FRONTEND_IMAGE="docker.io/${NAMESPACE}/${REPO}-frontend:${REF}-${SHA_SHORT}"
            export BACKEND_IMAGE FRONTEND_IMAGE

            if [ -z "$BACKEND_IMAGE" ] || [ -z "$FRONTEND_IMAGE" ]; then
              echo "ERROR: Failed to compute image tags for deploy" >&2
              exit 1
            fi

            echo "Deploying backend image: $BACKEND_IMAGE"
            echo "Deploying frontend image: $FRONTEND_IMAGE"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_FLAVOR="v1"
              compose() { docker-compose "$@"; }
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE_FLAVOR="v2"
              compose() { docker compose "$@"; }
            else
              echo "ERROR: Docker Compose is not installed on EC2" >&2
              exit 1
            fi

            compose -f docker-compose.prod.yml pull
            if [ "$COMPOSE_FLAVOR" = "v1" ]; then
              # docker-compose v1 on newer Docker engines can fail on container recreation.
              compose -f docker-compose.prod.yml down
              compose -f docker-compose.prod.yml up -d
            else
              compose -f docker-compose.prod.yml up -d --remove-orphans
            fi
            docker logout || true

            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:3000/health" >/dev/null; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: backend healthcheck failed on EC2" >&2
                compose -f docker-compose.prod.yml ps || true
                docker logs --tail 120 coreco_backend_1 || true
                exit 1
              fi
              sleep 2
            done

            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8080" | grep -qi "<html"; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: frontend smoke failed on EC2" >&2
                compose -f docker-compose.prod.yml ps || true
                docker logs --tail 120 coreco_frontend_1 || true
                exit 1
              fi
              sleep 2
            done
