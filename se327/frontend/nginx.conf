server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # resolve the backend per request so nginx still starts without it
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:3000;

    # API and uploaded files go to the backend container, so the browser
    # only ever talks to one origin
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
